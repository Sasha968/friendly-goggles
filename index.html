<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Сияние - 3 в ряд</title>
<style>
    * { -webkit-tap-highlight-color: transparent; }
    body {
        margin: 0;
        background: radial-gradient(circle at center, #2a2a4a, #0a0a1a);
        color: white;
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 10px;
        min-height: 100vh;
        touch-action: none;
        user-select: none;
    }
    h1 {
        margin: 10px;
        background: linear-gradient(90deg, #ff3366, #ffcc00, #33ff99, #3399ff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        font-size: 36px;
        text-align: center;
        letter-spacing: 2px;
        text-transform: uppercase;
    }
    #score {
        font-size: 24px;
        margin-bottom: 10px;
        text-shadow: 0 0 10px rgba(255,255,255,0.5);
    }
    canvas {
        background: #1a1a2a;
        border: 2px solid #555;
        border-radius: 15px;
        cursor: pointer;
        box-shadow: 0 0 30px rgba(100, 100, 255, 0.3);
        max-width: 95vw;
        max-height: 70vh;
        touch-action: none;
    }
</style>
</head>
<body>
<h1>Сияние</h1>
<div id="score">Счет: 0</div>
<canvas id="game" width="600" height="600"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');

const GRID_SIZE = 8;
const CELL_SIZE = canvas.width / GRID_SIZE;
const COLORS = ['#ff3366', '#33ff99', '#3399ff', '#ffcc00', '#cc33ff', '#33ffcc'];
const GLOW = ['#ff6699', '#66ffbb', '#66bbff', '#ffdd44', '#dd66ff', '#66ffdd'];

let grid = [];
let score = 0;
let selected = null;
let state = 'idle';
let particles = [];
let floatingTexts = [];
let shakeTime = 0;
let pulseTime = 0;
let animProgress = 0;
let swapData = null;
let removeData = null;

function createCell(color) {
    return {
        color: color,
        x: 0, y: 0,
        targetX: 0, targetY: 0,
        scale: 1, alpha: 1
    };
}

function initGrid() {
    grid = [];
    for (let i = 0; i < GRID_SIZE; i++) {
        grid[i] = [];
        for (let j = 0; j < GRID_SIZE; j++) {
            const c = Math.floor(Math.random() * COLORS.length);
            grid[i][j] = createCell(c);
            grid[i][j].x = grid[i][j].targetX = j * CELL_SIZE;
            grid[i][j].y = grid[i][j].targetY = i * CELL_SIZE;
        }
    }
    while (findMatches().length > 0) {
        for (let i = 0; i < GRID_SIZE; i++) {
            for (let j = 0; j < GRID_SIZE; j++) {
                grid[i][j].color = Math.floor(Math.random() * COLORS.length);
            }
        }
    }
}

function findMatches() {
    const matches = new Set();
    for (let i = 0; i < GRID_SIZE; i++) {
        for (let j = 0; j < GRID_SIZE - 2; j++) {
            const a = grid[i][j], b = grid[i][j+1], c = grid[i][j+2];
            if (!a || !b || !c) continue;
            const col = a.color;
            if (col >= 0 && col === b.color && col === c.color) {
                matches.add(i + ',' + j);
                matches.add(i + ',' + (j+1));
                matches.add(i + ',' + (j+2));
            }
        }
    }
    for (let i = 0; i < GRID_SIZE - 2; i++) {
        for (let j = 0; j < GRID_SIZE; j++) {
            const a = grid[i][j], b = grid[i+1][j], c = grid[i+2][j];
            if (!a || !b || !c) continue;
            const col = a.color;
            if (col >= 0 && col === b.color && col === c.color) {
                matches.add(i + ',' + j);
                matches.add((i+1) + ',' + j);
                matches.add((i+2) + ',' + j);
            }
        }
    }
    return Array.from(matches).map(s => s.split(',').map(Number));
}

function spawnParticles(i, j, color) {
    const cx = j * CELL_SIZE + CELL_SIZE / 2;
    const cy = i * CELL_SIZE + CELL_SIZE / 2;
    for (let k = 0; k < 12; k++) {
        const angle = (Math.PI * 2 * k) / 12 + Math.random() * 0.5;
        const speed = 2 + Math.random() * 3;
        particles.push({
            x: cx, y: cy,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1,
            color: GLOW[color] || '#fff',
            size: 3 + Math.random() * 3
        });
    }
}

function spawnFloatingText(i, j, text) {
    floatingTexts.push({
        x: j * CELL_SIZE + CELL_SIZE / 2,
        y: i * CELL_SIZE + CELL_SIZE / 2,
        text: text,
        life: 1,
        vy: -1.5
    });
}

function startSwap(i1, j1, i2, j2) {
    state = 'swapping';
    animProgress = 0;
    swapData = { i1, j1, i2, j2,
        x1: grid[i1][j1].x, y1: grid[i1][j1].y,
        x2: grid[i2][j2].x, y2: grid[i2][j2].y,
        reverse: false };
}

function finishSwap() {
    const { i1, j1, i2, j2, reverse } = swapData;
    if (reverse) {
        grid[i1][j1].x = grid[i1][j1].targetX;
        grid[i1][j1].y = grid[i1][j1].targetY;
        grid[i2][j2].x = grid[i2][j2].targetX;
        grid[i2][j2].y = grid[i2][j2].targetY;
        shakeTime = 0.3;
        state = 'idle';
        swapData = null;
        return;
    }
    const tmp = grid[i1][j1];
    grid[i1][j1] = grid[i2][j2];
    grid[i2][j2] = tmp;
    grid[i1][j1].targetX = j1 * CELL_SIZE;
    grid[i1][j1].targetY = i1 * CELL_SIZE;
    grid[i2][j2].targetX = j2 * CELL_SIZE;
    grid[i2][j2].targetY = i2 * CELL_SIZE;
    grid[i1][j1].x = grid[i1][j1].targetX;
    grid[i1][j1].y = grid[i1][j1].targetY;
    grid[i2][j2].x = grid[i2][j2].targetX;
    grid[i2][j2].y = grid[i2][j2].targetY;
    
    const matches = findMatches();
    if (matches.length === 0) {
        startSwap(i1, j1, i2, j2);
        swapData.reverse = true;
    } else {
        startRemove(matches);
    }
    swapData = null;
}

function startRemove(matches) {
    state = 'removing';
    animProgress = 0;
    removeData = { matches };
    for (const [i, j] of matches) {
        if (grid[i][j]) spawnParticles(i, j, grid[i][j].color);
    }
    if (matches.length > 0) {
        const [ci, cj] = matches[Math.floor(matches.length / 2)];
        spawnFloatingText(ci, cj, '+' + (matches.length * 10));
    }
    score += matches.length * 10;
    scoreEl.textContent = 'Счет: ' + score;
}

function finishRemove() {
    const { matches } = removeData;
    for (const [i, j] of matches) {
        grid[i][j] = null;
    }
    for (let j = 0; j < GRID_SIZE; j++) {
        let empty = 0;
        for (let i = GRID_SIZE - 1; i >= 0; i--) {
            if (grid[i][j] === null) {
                empty++;
            } else if (empty > 0) {
                grid[i + empty][j] = grid[i][j];
                grid[i + empty][j].targetY = (i + empty) * CELL_SIZE;
                grid[i + empty][j].targetX = j * CELL_SIZE;
                grid[i + empty][j].y = i * CELL_SIZE;
                grid[i][j] = null;
            }
        }
        for (let i = 0; i < empty; i++) {
            const c = Math.floor(Math.random() * COLORS.length);
            const cell = createCell(c);
            cell.targetX = j * CELL_SIZE;
            cell.targetY = i * CELL_SIZE;
            cell.x = j * CELL_SIZE;
            cell.y = -(empty - i) * CELL_SIZE;
            grid[i][j] = cell;
        }
    }
    removeData = null;
    state = 'falling';
    animProgress = 0;
}

function finishFall() {
    for (let i = 0; i < GRID_SIZE; i++) {
        for (let j = 0; j < GRID_SIZE; j++) {
            if (!grid[i][j]) continue;
            grid[i][j].x = grid[i][j].targetX;
            grid[i][j].y = grid[i][j].targetY;
            grid[i][j].scale = 1;
            grid[i][j].alpha = 1;
        }
    }
    const matches = findMatches();
    if (matches.length > 0) {
        startRemove(matches);
    } else {
        state = 'idle';
    }
}

function easeOut(t) {
    return 1 - Math.pow(1 - t, 3);
}

function easeInOut(t) {
    return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
}

function update(dt) {
    pulseTime += dt;
    if (shakeTime > 0) shakeTime -= dt;
    
    for (let k = particles.length - 1; k >= 0; k--) {
        const p = particles[k];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.15;
        p.life -= dt * 1.5;
        if (p.life <= 0) particles.splice(k, 1);
    }
    for (let k = floatingTexts.length - 1; k >= 0; k--) {
        const t = floatingTexts[k];
        t.y += t.vy;
        t.life -= dt * 1.2;
        if (t.life <= 0) floatingTexts.splice(k, 1);
    }
    
    if (state === 'swapping' && swapData) {
        animProgress += dt * 4;
        if (animProgress >= 1) {
            animProgress = 1;
            finishSwap();
        } else {
            const t = easeInOut(animProgress);
            const { i1, j1, i2, j2, x1, y1, x2, y2 } = swapData;
            if (grid[i1][j1]) {
                grid[i1][j1].x = x1 + (x2 - x1) * t;
                grid[i1][j1].y = y1 + (y2 - y1) * t;
            }
            if (grid[i2][j2]) {
                grid[i2][j2].x = x2 + (x1 - x2) * t;
                grid[i2][j2].y = y2 + (y1 - y2) * t;
            }
        }
    } else if (state === 'removing' && removeData) {
        animProgress += dt * 3;
        if (animProgress >= 1) {
            animProgress = 1;
            finishRemove();
        } else {
            const t = easeOut(animProgress);
            for (const [i, j] of removeData.matches) {
                if (grid[i][j]) {
                    grid[i][j].scale = 1 - t;
                    grid[i][j].alpha = 1 - t;
                }
            }
        }
    } else if (state === 'falling') {
        animProgress += dt * 3;
        let allDone = true;
        for (let i = 0; i < GRID_SIZE; i++) {
            for (let j = 0; j < GRID_SIZE; j++) {
                const cell = grid[i][j];
                if (!cell) continue;
                const dx = cell.targetX - cell.x;
                const dy = cell.targetY - cell.y;
                if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5) {
                    cell.x += dx * 0.25;
                    cell.y += dy * 0.25;
                    allDone = false;
                } else {
                    cell.x = cell.targetX;
                    cell.y = cell.targetY;
                }
            }
        }
        if (animProgress >= 1.5 || allDone) {
            finishFall();
        }
    }
}

function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
}

function draw() {
    ctx.save();
    if (shakeTime > 0) {
        const s = shakeTime * 15;
        ctx.translate((Math.random() - 0.5) * s, (Math.random() - 0.5) * s);
    }
    
    ctx.fillStyle = '#1a1a2a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= GRID_SIZE; i++) {
        ctx.beginPath();
        ctx.moveTo(0, i * CELL_SIZE);
        ctx.lineTo(canvas.width, i * CELL_SIZE);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(i * CELL_SIZE, 0);
        ctx.lineTo(i * CELL_SIZE, canvas.height);
        ctx.stroke();
    }
    
    for (let i = 0; i < GRID_SIZE; i++) {
        for (let j = 0; j < GRID_SIZE; j++) {
            const cell = grid[i][j];
            if (!cell || cell.color < 0) continue;
            const color = COLORS[cell.color];
            const glow = GLOW[cell.color];
            const size = (CELL_SIZE - 10) * cell.scale;
            const x = cell.x + (CELL_SIZE - size) / 2;
            const y = cell.y + (CELL_SIZE - size) / 2;
            
            ctx.save();
            ctx.globalAlpha = cell.alpha;
            
            ctx.shadowColor = glow;
            ctx.shadowBlur = 15;
            ctx.fillStyle = color;
            roundRect(ctx, x, y, size, size, 12);
            ctx.fill();
            ctx.shadowBlur = 0;
            
            const grad = ctx.createLinearGradient(x, y, x, y + size);
            grad.addColorStop(0, 'rgba(255,255,255,0.4)');
            grad.addColorStop(0.5, 'rgba(255,255,255,0)');
            ctx.fillStyle = grad;
            roundRect(ctx, x, y, size, size, 12);
            ctx.fill();
            
            if (selected && selected[0] === i && selected[1] === j && state === 'idle') {
                const pulse = 0.5 + 0.5 * Math.sin(pulseTime * 6);
                ctx.strokeStyle = `rgba(255,255,255,${0.5 + pulse * 0.5})`;
                ctx.lineWidth = 3 + pulse * 2;
                roundRect(ctx, x - 2, y - 2, size + 4, size + 4, 14);
                ctx.stroke();
            }
            
            ctx.restore();
        }
    }
    
    for (const p of particles) {
        ctx.save();
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
    
    for (const t of floatingTexts) {
        ctx.save();
        ctx.globalAlpha = t.life;
        ctx.fillStyle = '#ffcc00';
        ctx.font = 'bold 24px Arial';
        ctx.textAlign = 'center';
        ctx.shadowColor = '#ff6600';
        ctx.shadowBlur = 10;
        ctx.fillText(t.text, t.x, t.y);
        ctx.restore();
    }
    
    ctx.restore();
}

function handleInput(clientX, clientY) {
    if (state !== 'idle') return;
    const rect = canvas.getBoundingClientRect();
    const x = (clientX - rect.left) * (canvas.width / rect.width);
    const y = (clientY - rect.top) * (canvas.height / rect.height);
    const j = Math.floor(x / CELL_SIZE);
    const i = Math.floor(y / CELL_SIZE);
    if (i < 0 || i >= GRID_SIZE || j < 0 || j >= GRID_SIZE) return;

    if (!selected) {
        selected = [i, j];
    } else {
        const [si, sj] = selected;
        if (Math.abs(si - i) + Math.abs(sj - j) === 1) {
            startSwap(si, sj, i, j);
        }
        selected = null;
    }
}

canvas.addEventListener('click', (e) => {
    handleInput(e.clientX, e.clientY);
});

canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (e.touches.length > 0) {
        handleInput(e.touches[0].clientX, e.touches[0].clientY);
    }
}, { passive: false });

document.addEventListener('touchmove', (e) => {
    if (e.target === canvas) e.preventDefault();
}, { passive: false });

let lastTime = performance.now();
function loop(now) {
    const dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
}

initGrid();
requestAnimationFrame(loop);
</script>
</body>
</html>
